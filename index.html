<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Instituto Superior Porteño</title>
<meta name="theme-color" content="#1F2A3A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
  // Aplica el tema elegido en Configuración antes de pintar (evita un parpadeo al abrir).
  try{ var t = JSON.parse(localStorage.getItem('isp_tema') || '"auto"'); if(t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); }catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loadingScreen">
  <img src="icon-192.png" alt="ISP">
  <p>Instituto Superior Porteño</p>
  <div class="skeleton-wrap">
    <div class="skeleton-bar" style="width:60%;height:22px;margin-bottom:18px;"></div>
    <div class="skeleton-bar" style="height:64px;"></div>
    <div class="skeleton-bar" style="height:64px;"></div>
    <div class="skeleton-bar" style="height:44px;"></div>
    <div class="skeleton-bar" style="height:44px;"></div>
    <div class="skeleton-bar" style="height:44px;"></div>
  </div>
</div>
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <p class="modal-msg" id="modalMsg"></p>
    <div id="modalExtra"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>
<div class="status-spacer"><img src="icon-192.png" alt="ISP"><span>Instituto Superior Porteño</span></div>
<div class="offline-banner" id="offlineBanner">Sin conexión — los cambios se van a guardar cuando vuelva internet</div>
<div class="offline-banner hist-banner" id="histBanner">Cargando el histórico de asistencia…</div>
<div id="app">
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
